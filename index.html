<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الشخصية المميزة</title>
    <!-- خط cairo للغة العربية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* المتغيرات الأساسية للألوان */
        :root {
            --bg-color: #0d0d0d;         /* أسود فاخر */
            --card-bg: #161616;          /* رمادي غامق جداً للكروت */
            --text-white: #ffffff;       /* أبيض صافي */
            --text-muted: #a1a1aa;       /* أبيض هادي/رمادي فاتح */
            --pink-primary: #ff2a85;     /* بينك زهري حاد ومشرق */
            --pink-glow: rgba(255, 42, 133, 0.35); /* إضاءة بينك */
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            line-height: 1.8;
            padding: 30px 15px;
            overflow-x: hidden;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        /*  القسم الرئيسي (Hero) */
        .hero {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(145deg, #18181b, #0d0d0d);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            margin-bottom: 40px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        .profile-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--pink-primary);
            box-shadow: 0 0 25px var(--pink-glow);
            margin-bottom: 15px;
            transition: transform 0.4s ease;
        }

        .profile-avatar:hover {
            transform: scale(1.08) rotate(3deg);
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--text-white);
        }

        .hero h1 span {
            color: var(--pink-primary);
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 5px;
        }

        /* عنوان الأقسام */
        .section-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .section-header h2 {
            font-size: 1.6rem;
            color: var(--text-white);
            display: inline-block;
            position: relative;
        }

        .section-header h2::after {
            content: '';
            display: block;
            width: 50%;
            height: 3px;
            background: var(--pink-primary);
            margin: 5px auto 0;
            border-radius: 2px;
            box-shadow: 0 0 10px var(--pink-primary);
        }

        /* كروت الأقسام التفاعلية (Accordion Cards) */
        .interactive-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 50px;
        }

        .topic-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .topic-card:hover {
            border-color: var(--pink-primary);
            box-shadow: 0 0 20px var(--pink-glow);
            transform: translateY(-3px);
        }

        /* رأس الكارت اللي بتدوسي عليه */
        .card-header {
            padding: 22px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.02);
            user-select: none;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-white);
        }

        .card-icon {
            font-size: 1.4rem;
            color: var(--pink-primary);
        }

        .toggle-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: rgba(255, 42, 133, 0.1);
            color: var(--pink-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            transition: transform 0.4s ease, background 0.3s ease;
        }

        /* محتوى الكارت لما يتفتح */
        .card-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0, 1, 0, 1), padding 0.3s ease;
            padding: 0 25px;
            background: #111111;
        }

        /* حالة الفتح عند الضغط */
        .topic-card.active {
            border-color: var(--pink-primary);
            box-shadow: 0 0 25px var(--pink-glow);
        }

        .topic-card.active .toggle-btn {
            transform: rotate(180deg);
            background: var(--pink-primary);
            color: #fff;
        }

        .topic-card.active .card-body {
            max-height: 1000px; /* تسع الصورة والتفاصيل */
            transition: max-height 0.7s ease-in-out;
            padding: 20px 25px 30px;
        }

        /* صورة القسم الخاصة */
        .section-image-box {
            width: 100%;
            height: 350px;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .section-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .topic-card.active .section-image-box img {
            transform: scale(1.03);
        }

        .card-text {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.8;
        }

        /* وسم / تاجز داخلية لشكل سمبل شيك */
        .tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .tag-item {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-white);
            border: 1px solid var(--pink-primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
            transition: all 0.3s ease;
        }

        .tag-item:hover {
            background: var(--pink-primary);
            color: #fff;
            box-shadow: 0 0 10px var(--pink-glow);
        }

        /* الذيل Footer */
        footer {
            text-align: center;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        footer span {
            color: var(--pink-primary);
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- القسم الرئيسي هيدر -->
        <section class="hero">
            <img src="C:\Users\Elgarhy\Desktop\حسين\IMG-20260920-WA0004.jpg" alt="الصورة الشخصية" class="profile-avatar">
            <h1>HUSEIN <span>MAGDY</span></h1>
            <p>راجل طيب و محترم</p>
        </section>

        <!-- عنوان الأقسام الثلاثة -->
        <div class="section-header">
            <h2> انجازات حسين</h2>
        </div>

        <!-- الأقسام الثلاثة التفاعلية -->
        <div class="interactive-section">

            <!-- القسم الأول -->
            <div class="topic-card" onclick="toggleCard(this)">
                <div class="card-header">
                    <div class="card-title">
                        <span class="card-icon"></span>
                        <span>خريج كليه حقوق</span>
                    </div>
                    <div class="toggle-btn">↓</div>
                </div>
                <div class="card-body">
                    <div class="section-image-box">
                        <img src="C:\Users\Elgarhy\Desktop\حسين\IMG-20260920-WA0007(1).jpg" alt="صورة الإنجازات">
                    </div>
                    <div class="card-text">
حاصل على ليسانس حقوق بتقدير جيد جداً من جامعة القاهرة                     </div>
                    <div class="tags-list">
                        <span class="tag-item">🎓 التخرج</span>
                        <span class="tag-item">💻 مشروع متميز</span>
                        <span class="tag-item">⭐ شهادة تقدير</span>
                    </div>
                </div>
            </div>

            <!-- القسم الثاني -->
            <div class="topic-card" onclick="toggleCard(this)">
                <div class="card-header">
                    <div class="card-title">
                        <span class="card-icon"></span>
                        <span>خدمة الجيش</span>
                    </div>
                    <div class="toggle-btn">↓</div>
                </div>
                <div class="card-body">
                    <div class="section-image-box">
                        <img src="C:\Users\Elgarhy\Desktop\حسين\IMG-20261008-WA0033(1).jpg" alt="صورة الاهتمامات">
                    </div>
                    <div class="card-text">
 خدم في الجيش ضابط دفاع جوي                   </div>
                    <div class="tags-list">
                        
                    </div>
                </div>
            </div>

            <!-- القسم الثالث -->
            <div class="topic-card" onclick="toggleCard(this)">
                <div class="card-header">
                    <div class="card-title">
                        <span class="card-icon">📸</span>
                        <span>الشغل الحالي</span>
                    </div>
                    <div class="toggle-btn">↓</div>
                </div>
                <div class="card-body">
                    <div class="section-image-box">
                        <img src="C:\Users\Elgarhy\Desktop\حسين\IMG-20260920-WA0008.jpg" alt="صورة اللحظات">
                    </div>
                    <div class="card-text">
                        مهندس و مشرف تشطيبات و ديكورات
                    </div>
                </div>
            </div>

        </div>

        <!-- الفوتر -->
        <footer>
            <span>♥</span>made by radwa
        </footer>

    </div>

    <!-- كود الجافا سكريبت للحبشتكنات والفتح/الإغلاق -->
    <script>
        function toggleCard(selectedCard) {
            // غلق بقية الكروت التانية عشان يفضل شكل الموقع مرتب
            const allCards = document.querySelectorAll('.topic-card');
            allCards.forEach(card => {
                if (card !== selectedCard) {
                    card.classList.remove('active');
                }
            });

            // فتح أو غلق الكارت المضغوط
            selectedCard.classList.toggle('active');
        }
    </script>

</body>
</html>
